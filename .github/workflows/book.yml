# Ändert sich der Text, werden drei Fassungen neu erzeugt und an das feste Release „epub-latest" gehängt,
# die Download-Links bleiben gleich:
#   EPUB          https://github.com/Cagliostro/HowToLiveBetterInGermany/releases/download/epub-latest/LebeBesser.epub
#   PDF           https://github.com/Cagliostro/HowToLiveBetterInGermany/releases/download/epub-latest/LebeBesser.pdf
#   Offline-HTML  https://github.com/Cagliostro/HowToLiveBetterInGermany/releases/download/epub-latest/LebeBesser.html
# Auf einem PR wird nur erzeugt und geprüft, nicht veröffentlicht; die Ergebnisse liegen im Artifact der Actions-Seite.
name: Elektronische Fassungen

on:
  push:
    branches: [main]
    paths:
      - README.md
      - index.html
      - og.png
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - og.png
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  # Verweisprüfung. Eigener Job, nicht am build-Job: Ein nicht ergänzter Anker darf nicht die
  # Veröffentlichung von EPUB, PDF und Offline-HTML aufhalten, das sind zwei Dinge. Auf einem PR
  # wird der Job trotzdem rot, auf main wird das Veröffentlichte weiterhin ausgeliefert.
  # Die lokale Kette (sync-stats.mjs) läuft nur, wenn sie jemand startet,
  # externe PRs erreichen sie überhaupt nicht, deshalb muss diese Prüfung in der CI stehen. Ohne Abhängigkeiten, wenige Sekunden.
  verweise:
    name: Verweise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-refs.mjs --check

  # Klartext-Prüfung: Länge, Forschungssprache, abstrakte Wendungen. Begründung wie oben, eigener Job, hält die Veröffentlichung nicht auf.
  klartext:
    name: Klartext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-plain.mjs

  # Statistikprüfung: Stimmen die Eintragszahlen, A/B/C-Zahlen, Linkzahlen in README, index.html und og.html mit book/ überein.
  # Lokal muss sync-stats.mjs laufen, damit sie aktualisiert werden; ein direkt im Web zusammengeführter PR kommt nie daran vorbei.
  # Begründung wie oben, hält die Veröffentlichung nicht auf.
  # Nur prüfen, nicht schreiben: Ein Commit der CI nach main würde vom lokalen Stand abweichen.
  statistik:
    name: Statistik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-stats.mjs --check --no-screenshot

  build:
    name: Fassungen erzeugen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - run: npm ci
        working-directory: tools/epub

      - name: EPUB
        run: node tools/epub/build.mjs

      - name: Offline-Einzeldatei (HTML)
        run: node tools/offline/build.mjs

      - name: Pandoc und Typst installieren
        run: |
          curl -sSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: PDF
        run: node tools/pdf/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/LebeBesser.epub

      - uses: actions/upload-artifact@v4
        with:
          name: LebeBesser
          path: |
            dist/LebeBesser.epub
            dist/LebeBesser.pdf
            dist/LebeBesser.html

      - name: In das Release epub-latest veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="Textstand Commit ${GITHUB_SHA::7}, erstellt am $(TZ='Europe/Berlin' date +'%Y-%m-%d %H:%M') (Berliner Zeit). EPUB, PDF und Offline-HTML, bei jeder Textänderung automatisch neu erzeugt, Download-Links unverändert."
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "Elektronische Fassungen (EPUB / PDF / Offline-HTML, automatisch aktualisiert)" --notes "$notes"
          else
            gh release create epub-latest --title "Elektronische Fassungen (EPUB / PDF / Offline-HTML, automatisch aktualisiert)" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/LebeBesser.epub \
            dist/LebeBesser.pdf \
            dist/LebeBesser.html --clobber
